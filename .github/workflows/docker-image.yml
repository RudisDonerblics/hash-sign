name: Build, Scan, and Publish Docker Image

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Go instalācija
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Binārā faila būvēšana
      - name: Build Go binary
        run: |
          mkdir -p publish
          go mod download
          CGO_ENABLED=0 GOOS=linux go build -o publish/hash-sign .
          ls -la publish/

      # Autentifikācija GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker tagu ģenerēšana
      - name: Set up Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}-,
            type=raw,value=latest

      # Docker attēla būvēšana un publicēšana
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Trivy instalācija (oficiālais APT repo)
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      # Trivy skenēšana (tikai pirmais tags)
      - name: Run Trivy scanner
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Skenē attēlu: $TAG"
          trivy image --format sarif --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            "$TAG"

      # Rezultātu augšupielāde GitHub Security cilnei
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
